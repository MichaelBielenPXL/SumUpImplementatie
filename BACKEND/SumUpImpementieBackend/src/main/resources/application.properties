spring.application.name=SumUpImpementieBackend

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update


# SumUp OAuth & Merchant gegevens
sumup.client-id=<client-id>
sumup.client-secret=<client-secret>
sumup.merchant-code=<merchant-code>

sumup.webhook-secret=${SUMUP_WEBHOOK_SECRET}

# Server port (optioneel)
server.port=8083